services:
  postgres:
    image: postgres:16-alpine
    container_name: healthchecker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: healthchecker
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d healthchecker"]
      interval: 3s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: healthchecker-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: healthchecker-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/healthchecker
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:3000
      NODE_ENV: production
    ports:
      - "4000:4000"

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: healthchecker-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/healthchecker
      REDIS_URL: redis://redis:6379
      WORKER_CONCURRENCY: 5
      WORKER_RATE_LIMIT_MAX: 10
      WORKER_RATE_LIMIT_DURATION: 1000

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: healthchecker-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      PORT: 3000
      API_INTERNAL_URL: http://api:4000
    ports:
      - "3000:3000"

volumes:
  pgdata:
  redisdata:
